# OpenShell's own claude-code profile injects an API key. This one injects a Claude
# subscription token, from `claude setup-token`. `harness doctor` imports it.
id: claude-code-subscription
display_name: Claude Code (subscription)
description: Claude Code CLI using a Claude subscription OAuth token
category: agent
inference_capable: true
credentials:
  - name: oauth_token
    description: Long-lived OAuth token printed by `claude setup-token`
    env_vars: [CLAUDE_CODE_OAUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [oauth_token]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/claude]
